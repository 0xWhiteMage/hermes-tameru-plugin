[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-tameru-plugin"
version = "1.4.1"
description = "Tameru deterministic extractive context compaction engine for Hermes Agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# pyyaml: the direct config.yaml read (tests/test_config.py); setuptools: the offline build_py packaging test
# (tests/test_packaging.py); hypothesis: the red-team fuzz harness (tests/test_fuzz_redteam.py). Without them
# those tests skip.
dev = ["pytest>=7", "ruff>=0.5", "pyyaml>=6", "setuptools>=61", "hypothesis>=6"]

[project.entry-points."hermes_agent.plugins"]
tameru = "hermes_tameru_plugin"

# tests/ is deliberately not packaged. New plugin modules live directly in hermes_tameru_plugin/
# (covered by the first entry); the vendored engine is the second.
[tool.setuptools]
packages = ["hermes_tameru_plugin", "hermes_tameru_plugin.tameru"]

[tool.setuptools.package-data]
hermes_tameru_plugin = ["plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "real_hermes: needs a real Hermes checkout (HERMES_REPO_ROOT); skipped otherwise",
    "stub_only: only meaningful against tests/hermes_stub; skipped on real Hermes",
    "perf: scaling/performance assertion; CI runs the suite with -m 'not perf'",
]

[tool.ruff]
line-length = 100
extend-exclude = ["hermes_tameru_plugin/tameru", "tests/hermes_stub"]

[tool.ruff.lint.per-file-ignores]
# Test code: imports after a sys.path edit (E402), terse generator lambdas (E731), `l` for "line" (E741).
"tests/**" = ["E402", "E731", "E741"]
