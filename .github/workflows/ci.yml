name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *"   # nightly: the plugin hooks private Hermes seams, so watch Hermes main
  workflow_dispatch:

permissions:
  contents: read

# The Hermes Agent revision the plugin is verified against lives in the HERMES_PIN file at the repository root: it is the
# commit the saved replay baselines were recorded on (tests/test_hermes_pin.py checks that). Bump it deliberately,
# together with the baselines and tests/test_seam_contract.py if a seam moved.

jobs:
  # Stub-mode unit tests: tests/hermes_stub stands in for Hermes' ``agent`` package.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0     # the rollback-script tests check out a release tag (v1.6.0)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: python -m pytest -m "not perf"

  # Real Hermes at the pinned SHA (required). Hermes' dependencies only resolve on Python 3.14.
  real-hermes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0     # the rollback-script tests check out a release tag (v1.6.0)
      - id: pin
        run: echo "sha=$(tr -d '[:space:]' < HERMES_PIN)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.pin.outputs.sha }}
          path: hermes-agent
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - run: python -m pip install --upgrade pip
      # Hermes pins Pillow exactly while its own browser-harness dependency pins a different one, which pip cannot
      # resolve; uv with an override installs the version Hermes itself pins.
      - run: |
          pip install uv
          echo "pillow==13.0.0" > "$RUNNER_TEMP/overrides.txt"
          uv pip install --system --override "$RUNNER_TEMP/overrides.txt" -e ./hermes-agent -e '.[dev]'
      - run: python -m pytest -m "not perf"
        env:
          HERMES_REPO_ROOT: ${{ github.workspace }}/hermes-agent

  # Same suite against Hermes main: an early warning that a private seam moved. Never blocks.
  hermes-main-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: main
          path: hermes-agent
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - run: python -m pip install --upgrade pip
      # Hermes pins Pillow exactly while its own browser-harness dependency pins a different one, which pip cannot
      # resolve; uv with an override installs the version Hermes itself pins.
      - run: |
          pip install uv
          echo "pillow==13.0.0" > "$RUNNER_TEMP/overrides.txt"
          uv pip install --system --override "$RUNNER_TEMP/overrides.txt" -e ./hermes-agent -e '.[dev]'
      - run: python -m pytest -m "not perf"
        env:
          HERMES_REPO_ROOT: ${{ github.workspace }}/hermes-agent

  # The vendored engine must be the engine repository's source at the commit hermes_tameru_plugin/tameru/__init__.py records.
  vendored:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: vendored
        run: echo "sha=$(grep -oP '^VENDORED_FROM = "\K[0-9a-f]{40}' hermes_tameru_plugin/tameru/__init__.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 0xWhiteMage/tameru-compaction-system
          ref: ${{ steps.vendored.outputs.sha }}
          path: engine
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/check_vendored.py engine

  # The Desktop panel (plain JavaScript run in jsdom with React) has its own tests. The runner's Node runs them; the three
  # packages they load are installed next to the job, at the versions the tests were written against.
  desktop-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: node --version
      - run: npm install --prefix "$RUNNER_TEMP/uideps" jsdom@29.1.1 react@19.3.0 react-dom@19.3.0
      - run: node --experimental-vm-modules --test tests/desktop/activity.test.mjs
        env:
          TAMERU_UI_TEST_DEPS: ${{ runner.temp }}/uideps/node_modules

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.15.10"  # pinned: newer ruff releases add rules that change results
      - run: ruff check .
      - run: python -m compileall -q hermes_tameru_plugin

  # The wheel must contain every plugin module, plugin.yaml and the Hermes entry point.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Assert the wheel contains every module, plugin.yaml and the entry point (and the sdist no tests)
        run: |
          python - <<'PY'
          import glob
          import pathlib
          import tarfile
          import zipfile

          (wheel,) = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
              entry_points = next(zf.read(n).decode() for n in names if n.endswith("entry_points.txt"))
          expected = {
              p.as_posix()
              for p in pathlib.Path("hermes_tameru_plugin").rglob("*.py")
              if "__pycache__" not in p.parts
          } | {"hermes_tameru_plugin/plugin.yaml"}
          missing = sorted(expected - names)
          assert not missing, f"missing from wheel: {missing}"
          assert not [n for n in names if n.startswith(("tests/", "docs/"))], "tests/docs must not ship"
          assert "[hermes_agent.plugins]" in entry_points and "tameru = hermes_tameru_plugin" in entry_points, entry_points
          (sdist,) = glob.glob("dist/*.tar.gz")
          with tarfile.open(sdist) as tf:
              stray = [n for n in tf.getnames() if "/tests/" in n or "/docs/" in n]
          assert not stray, f"sdist must not ship tests/docs (see MANIFEST.in): {stray}"
          print(f"{wheel}: {len(expected)} expected files present; {sdist} has no tests/docs")
          PY
